name: Checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  tests:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff check app tests
      - run: python -m ruff format --check app tests
      - run: python -m pytest -q
      - run: node --test tests/frontend.test.cjs
      - run: python -m app.evaluate
  container:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t document-rag:test .
      - name: Start and probe without credentials
        run: |
          docker run -d --name document-rag-ci -p 127.0.0.1:8000:8000 document-rag:test
          for attempt in $(seq 1 30); do
            curl --fail http://127.0.0.1:8000/healthz && break
            sleep 1
          done
          curl --fail http://127.0.0.1:8000/healthz
          curl --fail http://127.0.0.1:8000/docs
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/readyz)" = '503'
          python3 tests/container_smoke.py
          docker exec document-rag-ci python -m app.evaluate
      - if: always()
        run: |
          docker logs document-rag-ci
          docker rm -f document-rag-ci
