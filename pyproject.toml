[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "document-rag"
version = "0.1.0"
description = "Grounded question answering over uploaded PDF and JSON documents"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.142.2",
  "uvicorn==0.54.0",
  "python-multipart==0.0.32",
  "pypdf==6.19.0",
  "openai==2.54.0",
  "langchain-text-splitters==1.1.2",
  "openpyxl==3.1.5",
]

[project.optional-dependencies]
dev = [
  "httpx==0.28.1",
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
  "ruff==0.16.9",
  "reportlab==4.5.1",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 100
